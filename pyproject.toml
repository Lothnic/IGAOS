[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "igaos"
version = "0.1.0"
description = "Sovereign LP/MILP/QP solver core: primal+dual simplex, B&B with Gomory cuts, ADMM QP, and an optional GPU first-order PDHG engine"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Lothnic and the IGAOS contributors"}]
requires-python = ">=3.9"
keywords = [
    "optimization", "linear-programming", "mixed-integer-programming",
    "quadratic-programming", "simplex", "branch-and-bound", "admm",
    "first-order-methods", "pdlp", "gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Lothnic/IGAOS"
Documentation = "https://github.com/Lothnic/IGAOS#readme"
"Bug Tracker" = "https://github.com/Lothnic/IGAOS/issues"

[tool.scikit-build]
wheel.packages = ["python/igaos"]
sdist.exclude = ["benchmarks", "demo", "spike", "docs"]
build-dir = "build-wheel"

# CPU wheels are the PyPI default (no CUDA toolchain on build runners).
# For the GPU PDHG engine, build from source on a machine with nvcc:
#   pip install igaos --no-binary igaos --config-settings=cmake.define.IGAOS_ENABLE_CUDA=ON
# (CUDA is auto-detected when the variable is unset.)
